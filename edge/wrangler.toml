# Cloudflare Workers — Tapp store install stats
# Deploy: npm i && npx wrangler login && npm run deploy
# Secrets: ./scripts/setup-secrets.sh

name = "tapp-store-stats"
main = "src/index.ts"
compatibility_date = "2025-08-01"
workers_dev = true

# Custom domain: stats.store.myriad.you (CF dashboard)

[triggers]
crons = ["0 */6 * * *"]

[vars]
CATALOG_URL = "https://raw.githubusercontent.com/Myriad-You/tapp-store/main/index.json"
ALLOW_UNKNOWN_APPS = "false"
# Production: only Myriad backend (HMAC) may POST /v1/hit
ALLOW_ANONYMOUS_HITS = "false"
REQUIRE_HMAC = "true"
HIT_RATE_LIMIT_PER_MIN = "60"
BROWSER_HIT_RATE_LIMIT_PER_MIN = "20"
STATS_MAX_BATCH = "100"
STATS_TOP_MAX = "100"
CATALOG_IDS_TTL_SEC = "600"
# Secrets (never commit):
#   npx wrangler secret put INGEST_HMAC_SECRET
#   npx wrangler secret put ADMIN_TOKEN

[[kv_namespaces]]
binding = "STATS"
id = "61b671eb8a2e446a91309f197ff60858"

# Atomic per-app counters (SQLite-backed — required on Workers Free plan)
[[durable_objects.bindings]]
name = "APP_COUNTER"
class_name = "AppCounter"

[[migrations]]
tag = "v1_app_counter_sqlite"
new_sqlite_classes = ["AppCounter"]
