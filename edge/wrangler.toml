# Cloudflare Workers — Tapp store install stats (no secrets)
# Deploy: npm i && npx wrangler deploy
# Local:  npm run dev

name = "tapp-store-stats"
main = "src/index.ts"
compatibility_date = "2025-08-01"
workers_dev = true

# Custom domain: stats.store.myriad.you (CF dashboard)

[triggers]
crons = ["0 */6 * * *"]

[vars]
CATALOG_URL = "https://raw.githubusercontent.com/Myriad-You/tapp-store/main/index.json"
ALLOW_UNKNOWN_APPS = "false"
ALLOW_ANONYMOUS_HITS = "false"
HIT_RATE_LIMIT_PER_MIN = "120"
BROWSER_HIT_RATE_LIMIT_PER_MIN = "20"
INSTANCE_HIT_RATE_LIMIT_PER_MIN = "30"
STATS_MAX_BATCH = "100"
STATS_TOP_MAX = "100"
CATALOG_IDS_TTL_SEC = "600"
# DEV_RELAXED only in local .dev.vars — never production.

[[kv_namespaces]]
binding = "STATS"
id = "61b671eb8a2e446a91309f197ff60858"

[[durable_objects.bindings]]
name = "APP_COUNTER"
class_name = "AppCounter"

[[migrations]]
tag = "v1_app_counter_sqlite"
new_sqlite_classes = ["AppCounter"]
