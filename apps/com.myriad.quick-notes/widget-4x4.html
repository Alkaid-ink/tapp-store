<!-- Quick Notes Widget 4x4 v1.0.0 — mini sticky board -->
<div class="widget-root widget-4x4" data-widget-root="true">
  <div class="widget-bg">
    <div class="widget-glow glow-1"></div>
    <div class="widget-glow glow-2"></div>
  </div>

  <div class="widget-body">
    <!-- Header: icon + title + count -->
    <div class="widget-header">
      <div class="widget-brand">
        <span class="brand-icon" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 2v3M16 2v3M3 9h18"/>
            <path d="M21 8.5V17c0 3-1.5 5-5 5H8c-3.5 0-5-2-5-5V8.5c0-3 1.5-5 5-5h8c3.5 0 5 2 5 5z"/>
            <path d="M8 14h4M8 18h8"/>
          </svg>
        </span>
        <span class="brand-title" id="widget-title"></span>
      </div>
      <span class="widget-count" id="widget-count">0</span>
    </div>

    <!-- 2-column mini sticky board -->
    <div id="notes-list" class="notes-list notes-board" aria-live="polite">
      <!-- dynamic: mini-sticky items -->
    </div>

    <!-- Bottom composer -->
    <div class="widget-input-row">
      <input type="text" id="widget-input" placeholder="..." autocomplete="off">
      <button id="widget-add" type="button" title="Add" aria-label="Add">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </div>
  </div>
</div>
