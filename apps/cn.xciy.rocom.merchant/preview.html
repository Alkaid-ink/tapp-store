<!doctype html>
<html class="light" lang="zh-Hans">
<body>
  <main class="rocom-page rocom-preview" data-page-root>
    <header class="rocom-topbar">
      <div class="rocom-brand"><span aria-hidden="true">&#10022;</span><b>洛克王国</b><em>远行商人</em></div>
      <div class="rocom-sync"><i aria-hidden="true"></i><span>今日 12:30 已同步</span><button type="button">同步</button></div>
    </header>

    <section class="adventure-map">
      <div class="map-grid" aria-hidden="true"></div>
      <div class="map-road map-road-one" aria-hidden="true"></div>
      <div class="map-road map-road-two" aria-hidden="true"></div>
      <div class="map-pin pin-one" aria-hidden="true"></div>
      <div class="map-pin pin-two" aria-hidden="true"></div>
      <div class="map-copy">
        <p>TRAVELLING MERCHANT STOCK</p>
        <h1>远行商人货单</h1>
        <span>第 2 轮营业中，距离换货还有 1小时28分钟</span>
        <div class="hero-chips" aria-hidden="true"><b>每 4 小时换货</b><b>关注命中</b><b>王国行程</b></div>
      </div>
      <div class="hero-terminal merchant-showcase" aria-hidden="true">
        <div class="merchant-window">
          <span class="merchant-moon"></span>
          <div class="merchant-cart"><i></i><b></b><em></em></div>
          <div class="merchant-gems"><i></i><i></i><i></i></div>
          <div class="terminal-lines"><i></i><i></i><i></i></div>
        </div>
        <div class="terminal-badge"><span>货单已就绪</span><b>LIVE</b></div>
      </div>
    </section>

    <section class="quest-strip" aria-label="今日情报摘要">
      <article class="quest-card quest-market"><span>远行商人</span><strong>第 2 / 4 轮</strong><small>每 4 小时更换货物</small></article>
      <article class="quest-card quest-clock"><span>本轮倒计时</span><strong>1小时28分钟</strong><small>开市：08:00-24:00</small></article>
      <article class="quest-card quest-watch"><span>关注线索</span><strong>2 件命中</strong><small>本轮命中的关注物品</small></article>
    </section>

    <nav class="rocom-tabs" role="tablist" aria-label="王国情报分类">
      <button class="is-active" type="button"><i aria-hidden="true">&#9670;</i>商人货单</button>
      <button type="button"><i aria-hidden="true">&#9670;</i>活动行程</button>
      <button type="button"><i aria-hidden="true">&#9670;</i>王国公告</button>
      <button type="button"><i aria-hidden="true">&#9670;</i>精灵图鉴</button>
    </nav>

    <section class="intel-panel is-active">
      <div class="panel-head"><div><p>TRAVELLER'S STOCK</p><h2>远行商人货单</h2></div><div class="panel-actions"><span>6 件商品</span><button type="button">只看关注</button></div></div>
      <div class="product-grid" aria-live="polite">
        <article class="product-card is-watched"><span class="product-icon">球</span><div class="product-main"><div class="product-meta"><b>关注</b><span>限定</span></div><h3>国王球</h3><p>本轮重点关注道具</p></div></article>
        <article class="product-card"><span class="product-icon">晶</span><div class="product-main"><div class="product-meta"><span>材料</span></div><h3>星辉棱镜</h3><p>用于进阶与兑换</p></div></article>
        <article class="product-card is-watched"><span class="product-icon">羽</span><div class="product-main"><div class="product-meta"><b>关注</b><span>稀有</span></div><h3>晨光羽饰</h3><p>适合刷新后优先确认</p></div></article>
      </div>
    </section>
  </main>
</body>
</html>
